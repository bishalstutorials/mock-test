
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mock Test | Bishal's Tutorials</title>

    <link rel="stylesheet" href="css/style.css">

    <!-- MathJax Configuration -->
    <script>
        window.MathJax = {
            tex: {
                inlineMath: [['\\(', '\\)'], ['$', '$']],
                displayMath: [['\\[', '\\]'], ['$$', '$$']],
                processEscapes: true
            },
            svg: {
                fontCache: 'global'
            },
            startup: {
                typeset: false
            }
        };
    </script>

    <!-- MathJax Library -->
    <script
        defer
        src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js">
    </script>
</head>

<body>

    <header class="site-header">
        <div class="container">
            <a href="index.html" class="logo-link">
                <img src="assets/logo.png" alt="Bishal's Tutorials" class="logo">
            </a>
            <div class="header-text">
                <h1>Bishal's Tutorials</h1>
                <p>LEARN &amp; SUCCEED</p>
            </div>
        </div>
    </header>

    <main class="test-container">

        <section class="test-header">
            <h2 id="test-title">Loading Test...</h2>
            <p id="test-details"></p>
        </section>

        <section class="test-info">
            <div id="question-progress">0 of 0</div>
            <div id="timer">00:00</div>
        </section>

        <section class="question-section">

            <h3 id="question-number">Question 1</h3>

            <div id="question-text" class="question-text">
                Loading question...
            </div>

            <div id="options-container" class="options-container">
            </div>

            <p id="test-message" class="test-message"></p>

        </section>

        <section class="test-navigation">
            <button id="previous-button" type="button">
                Previous
            </button>

            <button id="next-button" type="button">
                Next
            </button>

            <button id="submit-button" type="button">
                Submit Test
            </button>
        </section>

    </main>

    <footer class="site-footer">
        <p>
            &copy; <span id="test-year"></span>
            Bishal's Tutorials | LEARN &amp; SUCCEED
        </p>
    </footer>

    <!-- Test JavaScript: Keep this after MathJax -->
    <script src="js/test.js"></script>

</body>
</html>
