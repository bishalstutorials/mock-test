
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#12346b">
    <title>Test Result | Bishal's Tutorials</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    
<header class="site-header">
    <div class="brand">
        <img src="assets/logo.png"
             alt="Bishal's Tutorials Logo"
             class="brand-logo">

        <div>
            <h1>Bishal's Tutorials</h1>
            <p>LEARN &amp; SUCCEED</p>
        </div>
    </div>
</header>


    <main class="test-page">
        <section class="question-card">
            <h2>Test Result</h2>
            <p id="result-title"></p>

            <div class="test-info">
                <div>
                    <span class="info-label">SCORE</span>
                    <strong id="result-score">—</strong>
                </div>
                <div>
                    <span class="info-label">CORRECT</span>
                    <strong id="result-correct">—</strong>
                </div>
            </div>

            <p id="result-summary"></p>

            <div class="result-actions">
                <button id="download-pdf-button"
                        class="primary-button"
                        type="button">
                    Download Result PDF
                </button>

                <button class="secondary-button"
                        type="button"
                        onclick="window.location.href='index.html'">
                    Back to Home
                </button>
            </div>
        </section>
    </main>

    <footer class="site-footer">
        <p>© <span id="result-year"></span> Bishal's Tutorials</p>
        <p>LEARN &amp; SUCCEED</p>
    </footer>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="js/pdf.js"></script>
    <script src="js/result.js"></script>
</body>
</html>
